<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>校園整潔評分上傳系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

    <header class="bg-blue-600 text-white py-4 px-6 shadow-md sticky top-0 z-50">
        <h1 class="text-lg font-bold text-center">🧹 校園整潔評分拍照系統</h1>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- 步驟一：基本資料 -->
        <section class="bg-white p-4 rounded-xl shadow-sm space-y-3">
            <h2 class="font-semibold text-blue-600 border-b pb-2">1. 評分基本資料</h2>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">受評班級</label>
                <select id="classSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-base bg-white">
                    <option value="">請選擇班級</option>
                    <option value="商一1">商一1</option>
                    <option value="國一1">國一1</option>
                    <option value="航一1">航一1</option>
                    <option value="電一1">電一1</option>
                    <option value="資一1">資一1</option>
                    <option value="廣一1">廣一1</option>
                    <option value="美一1">美一1</option>
                    <option value="英一1">英一1</option>
                    <option value="日一1">日一1</option>
                    <option value="高一1">高一1</option>
                    <option value="高一2">高一2</option>
                    <option value="高一3">高一3</option>
                    <option value="高一4">高一4</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">缺失項目（可複選與自訂）</label>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <label class="flex items-center space-x-2 text-sm bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <input type="checkbox" name="issue" value="垃圾未倒" class="w-4 h-4 text-blue-600 rounded">
                        <span>🗑️ 垃圾未倒</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <input type="checkbox" name="issue" value="地面髒亂" class="w-4 h-4 text-blue-600 rounded">
                        <span>🧹 地面髒亂</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <input type="checkbox" name="issue" value="掃具未歸位" class="w-4 h-4 text-blue-600 rounded">
                        <span>🪵 掃具未歸位</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <input type="checkbox" name="issue" value="黑板未擦" class="w-4 h-4 text-blue-600 rounded">
                        <span>⬛ 黑板未擦</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <input type="checkbox" name="issue" value="桌椅未整齊" class="w-4 h-4 text-blue-600 rounded">
                        <span>🪑 桌椅未整齊</span>
                    </label>
                </div>
                <input type="text" id="otherIssueInput" placeholder="其他補充說明 (選填)" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
            </div>
        </section>

        <!-- 步驟二：拍照與預覽 -->
        <section class="bg-white p-4 rounded-xl shadow-sm space-y-3">
            <h2 class="font-semibold text-blue-600 border-b pb-2">2. 現場拍照蒐證</h2>

            <div id="uploadContainer" class="flex flex-col items-center justify-center border-2 border-dashed border-blue-400 rounded-xl p-6 bg-blue-50 relative cursor-pointer active:bg-blue-100 transition">
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-20">

                <div id="placeholder" class="text-center space-y-2 pointer-events-none">
                    <svg class="w-12 h-12 mx-auto text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0118.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <p class="text-base font-bold text-blue-700">點擊此處開啟相機拍照</p>
                    <p class="text-xs text-slate-500">拍照後將自動合成班級與時間浮水印</p>
                </div>

                <canvas id="previewCanvas" class="hidden max-w-full rounded-lg shadow-sm z-10"></canvas>
            </div>

            <button type="button" id="retakeBtn" class="hidden w-full py-2.5 text-sm text-slate-700 bg-slate-200 hover:bg-slate-300 rounded-xl font-medium">
                重拍 / 重新選擇照片
            </button>
        </section>

        <!-- 確認送出 -->
        <button type="button" id="submitBtn" disabled class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition duration-200">
            確認評分並開始背景上傳
        </button>

        <!-- 背景上傳狀態 -->
        <section class="bg-white rounded-xl shadow-sm p-4 space-y-3">
            <h3 class="font-semibold text-slate-700">☁️ 雲端上傳進度</h3>

            <div class="grid grid-cols-3 gap-2 text-center text-sm">
                <div class="bg-blue-50 rounded-lg p-2">
                    <div class="text-blue-600 font-bold text-xl" id="queueCount">0</div>
                    <div class="text-slate-500">等待上傳</div>
                </div>
                <div class="bg-amber-50 rounded-lg p-2">
                    <div class="text-amber-600 font-bold text-xl" id="uploadingCount">0</div>
                    <div class="text-slate-500">上傳中</div>
                </div>
                <div class="bg-green-50 rounded-lg p-2">
                    <div class="text-green-600 font-bold text-xl" id="successCount">0</div>
                    <div class="text-slate-500">已完成</div>
                </div>
            </div>

            <p id="uploadStatus" class="text-xs text-slate-500">目前沒有待上傳照片</p>
            <p id="failedCount" class="text-xs text-red-600"></p>
        </section>

    </main>

    <script>
        // Google Apps Script 網址
        const GAS_WEB_APP_URL =
            "https://script.google.com/macros/s/AKfycbwSIY16FbgW1-YeuqUiXm9AtRDv9V0SN-1dPoOx35YtT-j5GX8tvdpbOJMnxz2xHma_GA/exec";

        // 取得 HTML 元素
        const cameraInput = document.getElementById('cameraInput');
        const previewCanvas = document.getElementById('previewCanvas');
        const placeholder = document.getElementById('placeholder');
        const retakeBtn = document.getElementById('retakeBtn');
        const submitBtn = document.getElementById('submitBtn');
        const classSelect = document.getElementById('classSelect');
        const issueCheckboxes = document.querySelectorAll('input[name="issue"]');
        const otherIssueInput = document.getElementById('otherIssueInput');

        let loadedImage = null;

        // 背景上傳佇列
        let uploadQueue = [];
        let isUploading = false;
        let totalSuccess = 0;
        let totalFailed = 0;

        // 取得缺失項目
        function getSelectedIssues() {
            const selected = [];

            issueCheckboxes.forEach(cb => {
                if (cb.checked) selected.push(cb.value);
            });

            if (otherIssueInput.value.trim()) {
                selected.push(otherIssueInput.value.trim());
            }

            return selected.join("、");
        }

        // 檢查表單是否完成
        function checkFormReady() {
            const hasIssue =
                Array.from(issueCheckboxes).some(cb => cb.checked) ||
                otherIssueInput.value.trim() !== "";

            submitBtn.disabled = !(
                classSelect.value &&
                hasIssue &&
                loadedImage
            );
        }

        // 班級或缺失變更時更新浮水印
        classSelect.addEventListener('change', () => {
            checkFormReady();
            if (loadedImage) drawWatermarkedImage();
        });

        issueCheckboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                checkFormReady();
                if (loadedImage) drawWatermarkedImage();
            });
        });

        otherIssueInput.addEventListener('input', () => {
            checkFormReady();
            if (loadedImage) drawWatermarkedImage();
        });

        // 拍照 / 選擇圖片
        cameraInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = function(event) {
                const img = new Image();

                img.onload = function() {
                    loadedImage = img;
                    drawWatermarkedImage();

                    placeholder.classList.add('hidden');
                    previewCanvas.classList.remove('hidden');
                    retakeBtn.classList.remove('hidden');

                    checkFormReady();
                };

                img.onerror = function() {
                    alert("圖片載入失敗，請重新拍攝或選擇照片。");
                };

                img.src = event.target.result;
            };

            reader.onerror = function() {
                alert("讀取照片失敗，請重新拍攝。");
            };

            reader.readAsDataURL(file);
        });

        // 重拍 / 清除照片
        retakeBtn.addEventListener('click', function() {
            cameraInput.value = '';
            loadedImage = null;

            previewCanvas.classList.add('hidden');
            retakeBtn.classList.add('hidden');
            placeholder.classList.remove('hidden');

            checkFormReady();
        });

        // 合成照片浮水印
        function drawWatermarkedImage() {
            if (!loadedImage) return;

            const canvas = previewCanvas;
            const ctx = canvas.getContext('2d');

            // 限制最大寬度為 1200px
            let targetWidth = 1200;
            if (loadedImage.width < targetWidth) {
                targetWidth = loadedImage.width;
            }

            const scale = targetWidth / loadedImage.width;

            canvas.width = targetWidth;
            canvas.height = loadedImage.height * scale;

            ctx.drawImage(
                loadedImage,
                0,
                0,
                canvas.width,
                canvas.height
            );

            const className = "班級：" + (classSelect.value || "未選");
            const issueText = "缺失：" + (getSelectedIssues() || "未填");

            const now = new Date();

            const timeStr =
                "時間：" +
                now.getFullYear() + "/" +
                String(now.getMonth() + 1).padStart(2, '0') + "/" +
                String(now.getDate()).padStart(2, '0') + " " +
                String(now.getHours()).padStart(2, '0') + ":" +
                String(now.getMinutes()).padStart(2, '0');

            const barHeight = 130;

            ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
            ctx.fillRect(
                0,
                canvas.height - barHeight,
                canvas.width,
                barHeight
            );

            ctx.fillStyle = "#FFFFFF";
            ctx.font = "bold 38px sans-serif";
            ctx.fillText(className, 30, canvas.height - 75);

            ctx.font = "32px sans-serif";
            ctx.fillText(issueText, 30, canvas.height - 30);

            ctx.textAlign = "right";
            ctx.font = "24px sans-serif";
            ctx.fillStyle = "#E2E8F0";
            ctx.fillText(timeStr, canvas.width - 30, canvas.height - 45);
            ctx.textAlign = "left";
        }

        // 更新上傳進度
        function updateUploadStatus() {
            document.getElementById('queueCount').textContent =
                uploadQueue.length;

            document.getElementById('uploadingCount').textContent =
                isUploading ? 1 : 0;

            document.getElementById('successCount').textContent =
                totalSuccess;

            document.getElementById('failedCount').textContent =
                totalFailed > 0
                    ? `⚠️ 失敗 ${totalFailed} 張，請檢查網路或雲端紀錄`
                    : '';

            const status = document.getElementById('uploadStatus');

            if (isUploading && uploadQueue.length > 0) {
                status.textContent =
                    `正在上傳照片，另有 ${uploadQueue.length} 張等待中`;
            } else if (isUploading) {
                status.textContent = '正在上傳最後一張照片...';
            } else if (uploadQueue.length > 0) {
                status.textContent =
                    `尚有 ${uploadQueue.length} 張照片等待上傳`;
            } else {
                status.textContent = '目前沒有待上傳照片';
            }
        }

        // 背景上傳：一次一張，依照拍照順序
        async function processUploadQueue() {
            if (isUploading) return;

            isUploading = true;
            updateUploadStatus();

            while (uploadQueue.length > 0) {
                const payload = uploadQueue.shift();
                updateUploadStatus();

                try {
                    const response = await fetch(
                        GAS_WEB_APP_URL,
                        {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        }
                    );

                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }

                    const result = await response.json();

                    if (result.result === "success") {
                        totalSuccess++;
                    } else {
                        totalFailed++;
                        console.error('雲端回報上傳失敗：', result.error);
                    }

                } catch (err) {
                    totalFailed++;
                    console.error('照片上傳錯誤：', err);
                }

                updateUploadStatus();
            }

            isUploading = false;
            updateUploadStatus();

            console.log('背景上傳佇列處理完成');
        }

        // 確認評分並立即準備下一張
        submitBtn.addEventListener('click', function() {
            if (!loadedImage || !classSelect.value) return;
            if (submitBtn.disabled) return;

            submitBtn.disabled = true;

            try {
                // 最後一次合成浮水印
                drawWatermarkedImage();

                // 轉成獨立圖片資料，避免清除畫面影響佇列
                const imageData = previewCanvas.toDataURL('image/jpeg', 0.85);

                const className = classSelect.value;
                const issue = getSelectedIssues();
                const timestamp = new Date().toLocaleString();
                const fileName =
                    `整潔評分_${className}_${Date.now()}.jpg`;

                const payload = {
                    className: className,
                    issue: issue,
                    timestamp: timestamp,
                    fileName: fileName,
                    imageData: imageData
                };

                // 加入背景上傳佇列
                uploadQueue.push(payload);
                updateUploadStatus();

                // 清除缺失與照片，但刻意保留班級選擇
                issueCheckboxes.forEach(cb => {
                    cb.checked = false;
                });

                otherIssueInput.value = '';

                retakeBtn.click();

                // 班級維持原選擇；下一張只需重新選缺失、拍照
                checkFormReady();

                // 不等待上傳完成，背景自行處理
                processUploadQueue();

            } catch (err) {
                alert('照片處理失敗：' + err.message);
                checkFormReady();
            }
        });

        // 初始狀態
        updateUploadStatus();
    </script>

</body>
</html>
