<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>校園整潔評分上傳系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

    <!-- 頂部導覽列 -->
    <header class="bg-blue-600 text-white py-4 px-6 shadow-md sticky top-0 z-50">
        <h1 class="text-lg font-bold text-center">🧹 校園整潔評分拍照系統</h1>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- 步驟一：基本資料設定 -->
        <section class="bg-white p-4 rounded-xl shadow-sm space-y-3">
            <h2 class="font-semibold text-blue-600 border-b pb-2">1. 評分基本資料</h2>
            
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">受評班級（更換班級前將自動保持）</label>
                <select id="classSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-base bg-white font-bold text-blue-800">
                    <option value="">請選擇班級</option>
                    <option value="商一1">商一1</option>
                    <option value="國一1">國一1</option>
                    <option value="航一1">航一1</option>
                    <option value="電一1">電一1</option>
                    <option value="資一1">資一1</option>
                    <option value="廣一1">廣一1</option>
                    <option value="美一1">美一1</option>
                    <option value="英一1">英一1</option>
                    <option value="日一1">日一1</option>
                    <option value="高一1">高一1</option>
                    <option value="高一2">高一2</option>
                    <option value="高一3">高一3</option>
                    <option value="高一4">高一4</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">缺失項目（可複選與自訂）</label>
                <!-- 複選框群組 -->
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <label class="flex items-center space-x-2 text-sm bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <input type="checkbox" name="issue" value="垃圾未倒" class="w-4 h-4 text-blue-600 rounded">
                        <span>🗑️ 垃圾未倒</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <input type="checkbox" name="issue" value="地面髒亂" class="w-4 h-4 text-blue-600 rounded">
                        <span>🧹 地面髒亂</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <input type="checkbox" name="issue" value="掃具未歸位" class="w-4 h-4 text-blue-600 rounded">
                        <span>🪵 掃具未歸位</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <input type="checkbox" name="issue" value="黑板未擦" class="w-4 h-4 text-blue-600 rounded">
                        <span>⬛ 黑板未擦</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <input type="checkbox" name="issue" value="桌椅未整齊" class="w-4 h-4 text-blue-600 rounded">
                        <span>🪑 桌椅未整齊</span>
                    </label>
                </div>
                <input type="text" id="otherIssueInput" placeholder="其他補充說明 (選填)" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
            </div>
        </section>

        <!-- 步驟二：拍照與預覽 -->
        <section class="bg-white p-4 rounded-xl shadow-sm space-y-3">
            <h2 class="font-semibold text-blue-600 border-b pb-2">2. 現場拍照蒐證</h2>
            
            <div id="uploadContainer" class="flex flex-col items-center justify-center border-2 border-dashed border-blue-400 rounded-xl p-6 bg-blue-50 relative cursor-pointer active:bg-blue-100 transition">
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-20">
                <div id="placeholder" class="text-center space-y-2 pointer-events-none">
                    <svg class="w-12 h-12 mx-auto text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <p class="text-base font-bold text-blue-700">點擊此處開啟相機拍照</p>
                    <p class="text-xs text-slate-500">拍照後將自動合成班級與時間浮水印</p>
                </div>
                <!-- 預覽畫布 -->
                <canvas id="previewCanvas" class="hidden max-w-full rounded-lg shadow-sm z-10"></canvas>
            </div>
            
            <button type="button" id="retakeBtn" class="hidden w-full py-2.5 text-sm text-slate-700 bg-slate-200 hover:bg-slate-300 rounded-xl font-medium">重拍 / 重新選擇照片</button>
        </section>

        <!-- 步驟三：送出評分 -->
        <button type="button" id="submitBtn" disabled class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition duration-200">
            送出評分並上傳雲端
        </button>

    </main>

    <!-- 上傳處理中的載入遮罩 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex-col items-center justify-center z-50 text-white space-y-3">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent"></div>
        <p id="loadingText" class="font-medium text-lg">正在快速上傳至雲端硬碟與試算表...</p>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwSIY16FbgW1-YeuqUiXm9AtRDv9V0SN-1dPoOx35YtT-j5GX8tvdpbOJMnxz2xHma_GA/exec";

        const cameraInput = document.getElementById('cameraInput');
        const previewCanvas = document.getElementById('previewCanvas');
        const placeholder = document.getElementById('placeholder');
        const retakeBtn = document.getElementById('retakeBtn');
        const submitBtn = document.getElementById('submitBtn');
        const classSelect = document.getElementById('classSelect');
        const issueCheckboxes = document.querySelectorAll('input[name="issue"]');
        const otherIssueInput = document.getElementById('otherIssueInput');
        const loadingOverlay = document.getElementById('loadingOverlay');

        let loadedImage = null;

        function getSelectedIssues() {
            let selected = [];
            issueCheckboxes.forEach(cb => {
                if (cb.checked) selected.push(cb.value);
            });
            if (otherIssueInput.value.trim()) {
                selected.push(otherIssueInput.value.trim());
            }
            return selected.join("、");
        }

        function checkFormReady() {
            const hasIssue = Array.from(issueCheckboxes).some(cb => cb.checked) || otherIssueInput.value.trim() !== "";
            if (classSelect.value && hasIssue && loadedImage) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        classSelect.addEventListener('change', () => { checkFormReady(); if(loadedImage) drawWatermarkedImage(); });
        issueCheckboxes.forEach(cb => cb.addEventListener('change', () => { checkFormReady(); if(loadedImage) drawWatermarkedImage(); }));
        otherIssueInput.addEventListener('input', () => { checkFormReady(); if(loadedImage) drawWatermarkedImage(); });

        // 監聽拍照/選擇圖片
        cameraInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    loadedImage = img;
                    drawWatermarkedImage();
                    placeholder.classList.add('hidden');
                    previewCanvas.classList.remove('hidden');
                    retakeBtn.classList.remove('hidden');
                    checkFormReady();
                }
                img.onerror = function() {
                    alert("圖片載入失敗，請重新拍攝或選擇照片。");
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // 重新拍攝（重置圖片，但保留班級）
        retakeBtn.addEventListener('click', function() {
            cameraInput.value = '';
            loadedImage = null;
            previewCanvas.classList.add('hidden');
            retakeBtn.classList.add('hidden');
            placeholder.classList.remove('hidden');
            checkFormReady();
        });

        // 繪製浮水印到 Canvas（優化尺寸至 800px 以大幅減少檔案大小並提高上傳速度）
        function drawWatermarkedImage() {
            if (!loadedImage) return;

            const canvas = previewCanvas;
            const ctx = canvas.getContext('2d');

            let targetWidth = 800; // 最佳壓縮寬度，確保上傳速度極快且浮水印清晰
            if (loadedImage.width < targetWidth) {
                targetWidth = loadedImage.width;
            }
            const scale = targetWidth / loadedImage.width;
            canvas.width = targetWidth;
            canvas.height = loadedImage.height * scale;

            ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);

            const className = "班級：" + (classSelect.value || "未選");
            const issueText = "缺失：" + (getSelectedIssues() || "未填");
            
            const now = new Date();
            const timeStr = "時間：" + now.getFullYear() + "/" + 
                            String(now.getMonth() + 1).padStart(2, '0') + "/" + 
                            String(now.getDate()).padStart(2, '0') + " " + 
                            String(now.getHours()).padStart(2, '0') + ":" + 
                            String(now.getMinutes()).padStart(2, '0');

            // 依比例調降浮水印條高度與文字大小，保持視覺比例 perfect
            const barHeight = Math.round(canvas.height * 0.16); 
            const baseFontSize = Math.round(canvas.width * 0.032);

            ctx.fillStyle = "rgba(0, 0, 0, 0.68)";
            ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);

            ctx.fillStyle = "#FFFFFF";
            ctx.font = `bold ${baseFontSize * 1.2}px sans-serif`;
            ctx.fillText(className, 20, canvas.height - (barHeight * 0.58));

            ctx.font = `${baseFontSize}px sans-serif`;
            ctx.fillText(issueText, 20, canvas.height - (barHeight * 0.22));

            ctx.textAlign = "right";
            ctx.font = `${baseFontSize * 0.8}px sans-serif`;
            ctx.fillStyle = "#E2E8F0";
            ctx.fillText(timeStr, canvas.width - 20, canvas.height - (barHeight * 0.35));
            ctx.textAlign = "left";
        }

        // 送出並上傳至 GAS
        submitBtn.addEventListener('click', async function() {
            loadingOverlay.classList.remove('hidden');
            loadingOverlay.classList.add('flex');

            try {
                drawWatermarkedImage();
                // 使用 0.65 壓縮率，大幅降低 Base64 檔案大小
                const imageData = previewCanvas.toDataURL('image/jpeg', 0.65);
                
                const className = classSelect.value;
                const issue = getSelectedIssues();
                const timestamp = new Date().toLocaleString();
                const fileName = `整潔評分_${className}_${Date.now()}.jpg`;

                const payload = {
                    className: className,
                    issue: issue,
                    timestamp: timestamp,
                    fileName: fileName,
                    imageData: imageData
                };

                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                loadingOverlay.classList.add('hidden');
                loadingOverlay.classList.remove('flex');

                if (result.result === "success") {
                    alert(`🎉 ${className} 評分照片上傳成功！`);
                    
                    // 【關鍵優化】：上傳成功後「保留 classSelect.value」，只清空缺失勾選與照片
                    issueCheckboxes.forEach(cb => cb.checked = false);
                    otherIssueInput.value = "";
                    retakeBtn.click(); // 清空照片預覽，準備下一張拍攝
                } else {
                    alert("上傳失敗：" + (result.error || "未知錯誤"));
                }
            } catch (err) {
                loadingOverlay.classList.add('hidden');
                loadingOverlay.classList.remove('flex');
                alert("上傳過程發生錯誤：" + err.message);
            }
        });
    </script>
</body>
</html>
